kind = "web"
previewPath = "/"
title = "Task Manager"
description = "A role-based task management system for teams. Admins create and assign tasks with flexible deadlines (hours, days, weeks), view all employees' tasks and attendance, and get dashboard analytics. Employees see their own tasks with live countdown timers, mark attendance (check-in/out), and track their own history. Authentication is role-based with strict access control."
version = "1.0.0"
id = "artifacts/task-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18810

[services.development]
run = "pnpm --filter @workspace/task-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/task-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/task-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18810"
BASE_PATH = "/"
